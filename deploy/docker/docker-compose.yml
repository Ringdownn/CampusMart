services:
  mysql:
    image: mysql:8.0
    container_name: campusmart-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      - "../../database generater/campusmart-build-database.sql:/docker-entrypoint-initdb.d/01-campusmart.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - campusmart

  redis:
    image: redis:7-alpine
    container_name: campusmart-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - campusmart

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: campusmart-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - campusmart

  nacos:
    image: nacos/nacos-server:v2.2.3-slim
    container_name: campusmart-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      SPRING_DATASOURCE_PLATFORM: ""
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    networks:
      - campusmart

  minio:
    image: minio/minio:latest
    container_name: campusmart-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    networks:
      - campusmart

  minio-init:
    image: minio/mc:latest
    container_name: campusmart-minio-init
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"; do
          sleep 2
        done
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set download "local/$$MINIO_BUCKET"
    networks:
      - campusmart

  gateway:
    build:
      context: ../../server/gateway
      dockerfile: Dockerfile
    container_name: campusmart-gateway
    restart: unless-stopped
    depends_on:
      - nacos
      - redis
      - base-service
      - message-service
      - payment-service
      - trade-service
      - wallet-service
      - search-engine
    ports:
      - "${GATEWAY_PORT}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_APPLICATION_NAME: gateway
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: ${NACOS_NAMESPACE}
      SPRING_CLOUD_NACOS_CONFIG_ENABLED: "false"
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: message-ws
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://message-service:8083
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/ws/**
      SPRING_CLOUD_GATEWAY_ROUTES_1_ID: message-api
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://message-service:8083
      SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: Path=/app/messages/**
      SPRING_CLOUD_GATEWAY_ROUTES_2_ID: search-query
      SPRING_CLOUD_GATEWAY_ROUTES_2_URI: http://search-engine:5678
      SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0: Path=/api/query,/api/index,/api/index/**
      SPRING_CLOUD_GATEWAY_ROUTES_3_ID: search-legacy
      SPRING_CLOUD_GATEWAY_ROUTES_3_URI: http://search-engine:5678
      SPRING_CLOUD_GATEWAY_ROUTES_3_PREDICATES_0: Path=/api/search/**
      SPRING_CLOUD_GATEWAY_ROUTES_3_FILTERS_0: RewritePath=/api/search/(?<segment>.*), /api/$${segment}
      SPRING_CLOUD_GATEWAY_ROUTES_4_ID: payment-service
      SPRING_CLOUD_GATEWAY_ROUTES_4_URI: http://payment-service:8092
      SPRING_CLOUD_GATEWAY_ROUTES_4_PREDICATES_0: Path=/app/alipay/**,/app/payments/**,/app/orders/*/pay/alipay,/internal/alipay/**,/internal/payments/**
      SPRING_CLOUD_GATEWAY_ROUTES_5_ID: trade-service
      SPRING_CLOUD_GATEWAY_ROUTES_5_URI: http://trade-service:8091
      SPRING_CLOUD_GATEWAY_ROUTES_5_PREDICATES_0: Path=/app/orders/**
      SPRING_CLOUD_GATEWAY_ROUTES_6_ID: wallet-service
      SPRING_CLOUD_GATEWAY_ROUTES_6_URI: http://wallet-service:8093
      SPRING_CLOUD_GATEWAY_ROUTES_6_PREDICATES_0: Path=/app/wallet,/app/wallet/**
      SPRING_CLOUD_GATEWAY_ROUTES_7_ID: base-service
      SPRING_CLOUD_GATEWAY_ROUTES_7_URI: lb://base-service
      SPRING_CLOUD_GATEWAY_ROUTES_7_PREDICATES_0: Path=/app/**
    networks:
      - campusmart

  base-service:
    build:
      context: ../../server/base-service
      dockerfile: Dockerfile
    container_name: campusmart-base-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      nacos:
        condition: service_started
      search-engine:
        condition: service_started
    environment:
      SERVER_PORT: 8081
      SPRING_APPLICATION_NAME: base-service
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: ${NACOS_NAMESPACE}
      SPRING_CLOUD_NACOS_CONFIG_ENABLED: "false"
      MYBATIS_PLUS_MAPPER_LOCATIONS: classpath*:mapper/*.xml
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET}
      SEARCH_ENGINE_URL: http://search-engine:5678
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    networks:
      - campusmart

  message-service:
    build:
      context: ../../server/message-service-go
      dockerfile: Dockerfile
    container_name: campusmart-message-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      PORT: 8083
      MESSAGE_DB_DSN: root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=True&loc=Local
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: ${NACOS_NAMESPACE}
      NACOS_GROUP: ${NACOS_GROUP}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET}
    networks:
      - campusmart

  payment-service:
    build:
      context: ../../server/payment-service
      dockerfile: Dockerfile
    container_name: campusmart-payment-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: 8092
      PAYMENT_DB_DSN: root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=True&loc=Local
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-campusmart-sandbox-app}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-http://localhost:8080/app/payments/alipay/notify}
      ALIPAY_MOCK_SIGN_SECRET: ${ALIPAY_MOCK_SIGN_SECRET:-campusmart-payment-mock-secret}
      ALIPAY_VERIFY_SIGNATURE: ${ALIPAY_VERIFY_SIGNATURE:-false}
    networks:
      - campusmart

  trade-service:
    build:
      context: ../../server/trade-service
      dockerfile: Dockerfile
    container_name: campusmart-trade-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      payment-service:
        condition: service_started
    environment:
      PORT: 8091
      TRADE_DB_DSN: root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=True&loc=Local
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      PAYMENT_SERVICE_URL: http://payment-service:8092
      JWT_SECRET: ${JWT_SECRET}
      PAY_TIMEOUT_MINUTES: ${PAY_TIMEOUT_MINUTES:-15}
    networks:
      - campusmart

  wallet-service:
    build:
      context: ../../server/wallet-service
      dockerfile: Dockerfile
    container_name: campusmart-wallet-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: 8093
      WALLET_DB_DSN: root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=True&loc=Local
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - campusmart

  search-engine:
    build:
      context: ../../server/search-engine
      dockerfile: Dockerfile
    container_name: campusmart-search-engine
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: /
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${ALIBABA_CLOUD_ACCESS_KEY_ID:-}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}
    volumes:
      - ../../server/search-engine/data:/root/data
    networks:
      - campusmart

  ai-tagging:
    build:
      context: ../../server/ai-tagging
      dockerfile: Dockerfile
    container_name: campusmart-ai-tagging
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8080
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    volumes:
      - ../../server/ai-tagging/data:/app/data
    networks:
      - campusmart

networks:
  campusmart:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  nacos-data:
  nacos-logs:
  minio-data:
